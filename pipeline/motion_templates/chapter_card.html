<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#0b0c10; }
  .wrap { position:absolute; inset:0; display:flex; flex-direction:column;
          align-items:center; justify-content:center; text-align:center;
          font-family:'Inter','Segoe UI',sans-serif; }
  #bg { position:absolute; inset:0;
        background:radial-gradient(ellipse at 50% 45%, #17181c 0%, #0b0c10 70%); }
  #top { font-size:2.4vmin; letter-spacing:0.65vmin; color:#afddff; text-transform:uppercase; opacity:0; }
  #rule { width:0; height:0.3vmin; background:rgba(175,221,255,0.65); margin:3.1vmin 0; border-radius:0.2vmin; }
  #title { font-size:7.2vmin; font-weight:650; color:#ecedee; max-width:82vw;
           line-height:1.15; letter-spacing:-0.1vmin; opacity:0; transform:translateY(2.6vmin); }
</style></head>
<body>
  <div id="bg"></div>
  <div class="wrap">
    <div id="top">{{TOP}}</div>
    <div id="rule"></div>
    <div id="title">{{TITLE}}</div>
  </div>
<script>
const D = {{DURATION}};
const V = () => Math.min(innerWidth, innerHeight) / 100;
function ease(t) { return 1 - Math.pow(1 - Math.min(t, 1), 3); }
function renderFrame(t) {
  const outT = Math.max((t - D * 0.82) / (D * 0.18), 0);
  const fade = 1 - ease(outT);
  const e1 = ease(t / 0.8);
  const e2 = ease(Math.max(t - 0.3, 0) / 0.8);
  const v = V();
  document.getElementById('top').style.opacity = e1 * fade;
  const rule = document.getElementById('rule');
  rule.style.width = (52 * v * ease(Math.max(t - 0.15, 0) / 0.9) * fade) + 'px';
  const title = document.getElementById('title');
  title.style.opacity = e2 * fade;
  title.style.transform = `translateY(${2.6 * v * (1 - e2) - 1.3 * v * ease(outT)}px)`;
  document.getElementById('bg').style.transform = `scale(${1 + 0.05 * (t / D)})`;
}
window.renderFrame = renderFrame;
</script>
</body></html>
