<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#050506; }
  .wrap { position:absolute; inset:0; display:flex; flex-direction:column;
          align-items:center; justify-content:center; text-align:center;
          font-family:'Inter','Segoe UI',sans-serif; }
  #bg { position:absolute; inset:0;
        background:radial-gradient(ellipse at 50% 55%, #101114 0%, #050506 72%); }
  #phrase { font-size:5vmin; font-weight:500; color:#d7d9dd; max-width:84vw;
            line-height:1.35; letter-spacing:0.03vmin; opacity:0; }
  #channel { margin-top:5.5vmin; font-size:2vmin; letter-spacing:0.45vmin; color:#6f747c;
             text-transform:uppercase; opacity:0; }
</style></head>
<body>
  <div id="bg"></div>
  <div class="wrap">
    <div id="phrase">{{PHRASE}}</div>
    <div id="channel">{{CHANNEL}}</div>
  </div>
<script>
const D = {{DURATION}};
function ease(t) { return 1 - Math.pow(1 - Math.min(t, 1), 3); }
function renderFrame(t) {
  // медленное «засыпание»: фраза проявляется долго, к концу всё мягко гаснет
  const inP = ease(Math.max(t - 0.4, 0) / (D * 0.45));
  const out = ease(Math.max(t - D * 0.78, 0) / (D * 0.22));
  const ph = document.getElementById('phrase');
  ph.style.opacity = inP * (1 - out);
  ph.style.letterSpacing = (0.03 + 0.11 * (t / D)) + 'vmin';
  document.getElementById('channel').style.opacity = ease(Math.max(t - D * 0.35, 0) / (D * 0.3)) * (1 - out);
  document.getElementById('bg').style.opacity = 1 - 0.35 * ease(Math.max(t - D * 0.7, 0) / (D * 0.3));
}
window.renderFrame = renderFrame;
</script>
</body></html>
