<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#0e0f10; }
  .wrap { position:absolute; inset:0; display:flex; flex-direction:column;
          align-items:center; justify-content:center; font-family:'Inter','Segoe UI',sans-serif; }
  #title { font-size:11vmin; font-weight:800; color:#ecedee; letter-spacing:-0.15vmin;
           opacity:0; transform:translateY(6vmin); text-align:center; padding:0 6vw; }
  #title .gold { color:#e8c766; }
  #subtitle { font-size:4.1vmin; color:#9ba0a6; margin-top:2.8vmin; opacity:0;
              transform:translateY(2.8vmin); text-align:center; padding:0 8vw; }
  #rule { width:0; height:0.4vmin; background:#e8c766; margin-top:3.7vmin; border-radius:0.2vmin; }
  #bg { position:absolute; inset:0;
        background:radial-gradient(ellipse at 50% 40%, #1e2023 0%, #0e0f10 70%); }
</style></head>
<body>
  <div id="bg"></div>
  <div class="wrap">
    <div id="title">{{TITLE}}</div>
    <div id="rule"></div>
    <div id="subtitle">{{SUBTITLE}}</div>
  </div>
<script>
const D = {{DURATION}};
const V = () => Math.min(innerWidth, innerHeight) / 100;
function ease(t) { return 1 - Math.pow(1 - Math.min(t, 1), 3); }
function renderFrame(t) {
  const inT = Math.min(t / (D * 0.25), 1);            // intro 25% of time
  const outT = Math.max((t - D * 0.8) / (D * 0.2), 0); // outro last 20%
  const v = V();
  const title = document.getElementById('title');
  const sub = document.getElementById('subtitle');
  const rule = document.getElementById('rule');
  const e1 = ease(inT), e2 = ease(Math.max(inT - 0.35, 0) / 0.65);
  title.style.opacity = e1 * (1 - ease(outT));
  title.style.transform = `translateY(${6 * v * (1 - e1) - 2 * v * ease(outT)}px)`;
  sub.style.opacity = e2 * (1 - ease(outT));
  sub.style.transform = `translateY(${3 * v * (1 - e2)}px)`;
  rule.style.width = (60 * v * ease(Math.max(inT - 0.2, 0) / 0.8) * (1 - ease(outT))) + 'px';
  const bg = document.getElementById('bg');
  bg.style.transform = `scale(${1 + 0.06 * (t / D)})`;
}
window.renderFrame = renderFrame;
</script>
</body></html>
