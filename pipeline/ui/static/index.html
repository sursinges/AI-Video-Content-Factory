<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>pipeline — MONOLITH 26.09</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;550;600&family=Inter+Tight:wght@500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23222326'/><rect x='9' y='9' width='14' height='14' rx='2' fill='none' stroke='%23e8e8ea' stroke-width='2'/></svg>">
<style>
/* ============================================================
   pipeline STUDIO — design system "MONOLITH"
   Язык: чёрное поле · сетка с плюсами · liquid-glass панели ·
   хореография появления (expo-out, стаггер) · Inter/Inter Tight
   ============================================================ */

:root {
  --bg: #000000;
  --txt: #ffffff;
  --dim: rgba(255,255,255,0.5);
  --faint: rgba(255,255,255,0.34);
  --line: rgba(255,255,255,0.08);
  --line-strong: rgba(255,255,255,0.16);
  --accent: #e8e8ea;
  --accent-dim: rgba(255,255,255,0.55);
  --ok: #8fd6a8;
  --err: #e58c8c;
  --run: #c9ccd1;
  --glass-hi: rgba(255,255,255,0.07);
  --glass-lo: rgba(255,255,255,0.035);
  --e-out: cubic-bezier(0.16, 1, 0.3, 1);
  --e-pen: cubic-bezier(0.37, 0.01, 0.2, 1);
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-display: 'Inter Tight', 'Inter', sans-serif;
  --mono: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
  --rad: 2px;
  --side: 216px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { height: 100%; }
body {
  background: var(--bg);
  color: var(--txt);
  font-family: var(--font);
  font-size: 13.5px;
  line-height: 1.5;
  min-height: 100%;
  display: flex;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "kern" 1;
}
::selection { background: rgba(175,221,255,0.25); }

/* ---------- sidebar ---------- */
aside {
  width: var(--side); min-width: var(--side);
  background: linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.02));
  border-right: 1px solid var(--line);
  backdrop-filter: blur(18px) saturate(115%);
  -webkit-backdrop-filter: blur(18px) saturate(115%);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh; z-index: 40;
  animation: slideL 0.92s var(--e-out) 0.05s backwards;
}
@keyframes slideL { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: none; } }
.brand { padding: 22px 18px 16px; }
.brand .row { display: flex; align-items: center; gap: 10px; }
.logo {
  width: 34px; height: 34px; border-radius: 2px;
  border: 1px solid rgba(255,255,255,0.8);
  display: flex; align-items: center; justify-content: center;
  color: var(--txt);
}
.logo svg { width: 18px; height: 18px; }
.brand b { font-family: var(--font-display); font-size: 15px; font-weight: 500; letter-spacing: 0.2px; }
.brand small {
  display: block; color: var(--faint); font-size: 9px;
  letter-spacing: 2.2px; text-transform: uppercase; margin-top: 1px;
}
nav.side { flex: 1; padding: 4px 12px; display: flex; flex-direction: column; gap: 1px; overflow-y: auto; }
nav.side .grp {
  font-size: 9.5px; letter-spacing: 1.8px; text-transform: uppercase;
  color: var(--faint); padding: 16px 10px 6px; font-weight: 500;
}
nav.side .grp::before { content: '[ '; color: var(--accent-dim); }
nav.side .grp::after  { content: ' ]'; color: var(--faint); }
nav.side button {
  display: flex; align-items: center; gap: 10px; width: 100%;
  background: none; border: none; border-left: 2px solid transparent;
  color: var(--dim); padding: 7px 10px; cursor: pointer; font-size: 13px;
  border-radius: 0; text-align: left; font-weight: 450;
  transition: background .15s var(--e-out), color .15s;
}
nav.side button:hover { color: var(--txt); background: rgba(255,255,255,0.045); }
nav.side button.active {
  color: var(--txt); font-weight: 550;
  background: rgba(255,255,255,0.06);
  border-left-color: var(--txt);
}
nav.side button.active span { letter-spacing: 0.1px; }
nav.side svg { width: 15px; height: 15px; flex-shrink: 0; opacity: 0.75; }
nav.side button.active svg { opacity: 1; color: var(--accent); }
.side-foot {
  padding: 12px 16px; border-top: 1px solid var(--line);
  font-size: 10px; color: var(--faint); letter-spacing: 0.6px; text-transform: uppercase;
}
.side-foot .dot {
  display: inline-block; width: 5px; height: 5px; border-radius: 50%;
  background: var(--ok); margin-right: 7px;
  animation: pulseDot 2.4s ease-in-out infinite;
}
.lang-foot { padding: 0 16px 14px; }
.side-search { padding: 8px 12px 0; }
.side-search input { margin: 0; font-size: 12px; padding: 7px 10px; }
.search-results { padding: 2px 12px; max-height: 230px; overflow-y: auto; }
.search-results .sr { padding: 6px 8px; cursor: pointer; border-radius: var(--rad); font-size: 12px; color: var(--dim); }
.search-results .sr:hover { background: rgba(255,255,255,0.05); color: var(--txt); }
.search-results .sr .t { font-size: 9px; color: var(--faint); text-transform: uppercase; letter-spacing: 1px; margin-right: 6px; }
.search-results .snippet { color: var(--faint); font-size: 11px; }
html[dir="rtl"] aside { border-right: none; border-left: 1px solid var(--line); }
html[dir="rtl"] nav.side button { border-left: none; border-right: 2px solid transparent; text-align: right; flex-direction: row-reverse; }
html[dir="rtl"] nav.side button.active { border-right-color: var(--txt); }
@keyframes pulseDot { 50% { opacity: 0.35; } }

/* ---------- main ---------- */
main { flex: 1; padding: 26px 34px 70px; max-width: 1180px; margin-inline: auto; position: relative; z-index: 1; }
.pagehead { margin-bottom: 24px; display: flex; justify-content: space-between; align-items: flex-end; animation: fadeUp .8s var(--e-out) 0.1s backwards; }
.pagehead h2 {
  font-family: var(--font-display); font-size: 21px; font-weight: 500;
  letter-spacing: -0.3px;
}
.pagehead p { color: var(--dim); font-size: 12.5px; margin-top: 4px; }

/* ---------- glass card ---------- */
.card {
  background: linear-gradient(180deg, rgba(255,255,255,0.055), rgba(255,255,255,0.028));
  backdrop-filter: blur(14px) saturate(115%);
  -webkit-backdrop-filter: blur(14px) saturate(115%);
  border: 1px solid var(--line);
  border-radius: var(--rad);
  padding: 18px 20px; margin-bottom: 16px;
  animation: fadeUp .8s var(--e-out) backwards;
  position: relative;
}
.card::after {
  content: ''; position: absolute; top: 0; left: 12%; width: 38%; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.28), transparent);
  pointer-events: none;
}
.card h3 {
  font-size: 10.5px; color: var(--dim); text-transform: uppercase;
  letter-spacing: 1.6px; margin-bottom: 14px; font-weight: 550;
}
.card h3::before { content: '// '; color: var(--accent-dim); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
.grid > .card:nth-child(1) { animation-delay: 0.06s; }
.grid > .card:nth-child(2) { animation-delay: 0.12s; }
.grid > .card:nth-child(3) { animation-delay: 0.18s; }
.grid > .card:nth-child(4) { animation-delay: 0.24s; }
.grid > .card:nth-child(n+5) { animation-delay: 0.3s; }

/* ---------- inputs ---------- */
select {
  appearance: none; -webkit-appearance: none;
  background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%238f9095' stroke-width='1.5' fill='none'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 14px center;
  padding-right: 30px;
}
input, select, textarea {
  width: 100%; background-color: rgba(255,255,255,0.04);
  border: 1px solid var(--line); color: var(--txt);
  border-radius: var(--rad); padding: 9px 11px; font-size: 13px;
  margin-bottom: 9px; outline: none; font-family: var(--font);
  transition: border-color .15s var(--e-out), background-color .15s;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--accent-dim); background-color: rgba(255,255,255,0.065);
}
input::placeholder, textarea::placeholder { color: var(--faint); }
textarea { resize: vertical; font-family: var(--mono); font-size: 11.5px; line-height: 1.55; }
select option { background: #111113; }

/* ---------- buttons: square, LŪMEN CTA language ---------- */
button.act, .btn {
  background: var(--accent); color: #000; border: none;
  border-radius: var(--rad); padding: 10px 20px;
  font-weight: 550; cursor: pointer; font-size: 12.5px;
  font-family: var(--font); letter-spacing: 0.4px;
  transition: background .15s var(--e-out), transform .15s var(--e-out);
}
button.act:hover, .btn:hover { background: #cdeaff; }
button.act:active, .btn:active { transform: translateY(1px); }
button.act:disabled, .btn:disabled { opacity: 0.35; cursor: default; }
button.mini, .btn-sm {
  background: transparent; color: var(--dim);
  border: 1px solid var(--line-strong); border-radius: var(--rad);
  padding: 5px 11px; cursor: pointer; font-size: 11.5px;
  font-family: var(--font); transition: all .15s var(--e-out);
}
button.mini:hover, .btn-sm:hover { color: var(--txt); border-color: var(--accent-dim); background: rgba(255,255,255,0.05); }

/* ---------- pills: PRIME_MEMBER chip language ---------- */
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 2px 8px; border-radius: 3px;
  font-size: 10.5px; font-weight: 550; letter-spacing: 0.4px;
}
.pill::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.p-done { background: rgba(255,255,255,0.06); color: var(--txt); }
.p-cancelled { background: rgba(217,195,106,0.08); color: #d9c36a; border: 1px solid rgba(217,195,106,0.35); }
.p-failed { background: rgba(229,140,140,0.1); color: var(--err); }
.p-running { background: rgba(175,221,255,0.08); color: var(--run); }
.p-running::before { animation: pulseDot 1.1s ease-in-out infinite; }
.p-pending, .b-pending { background: rgba(255,255,255,0.04); color: var(--faint); }

/* ---------- run rows ---------- */
.runrow {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 8px; border-bottom: 1px solid var(--line);
  cursor: pointer; transition: background .15s var(--e-out);
  animation: fadeUp .7s var(--e-out) backwards;
}
.runrow:hover { background: rgba(255,255,255,0.035); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06); }
.runrow:last-child { border: none; }
.runrow .rid {
  color: var(--faint); font-size: 11px; width: 74px;
  font-family: var(--mono); letter-spacing: 0.3px;
}
.runrow .topic { flex: 1; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.steps { display: flex; gap: 4px; }
.step { width: 13px; height: 13px; border: 1px solid var(--line-strong); background: transparent; }
.step.done { background: var(--txt); border-color: var(--txt); }
.step.failed { background: var(--err); border-color: var(--err); }
.step.running { background: var(--run); border-color: var(--run); animation: pulseDot 1.1s ease-in-out infinite; }

/* ---------- tables ---------- */
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
td, th { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
th {
  color: var(--faint); font-weight: 500; font-size: 10px;
  text-transform: uppercase; letter-spacing: 1.4px;
  white-space: nowrap;
}
th::before { content: '[ '; color: var(--faint); }
th::after  { content: ' ]'; color: var(--faint); }

/* ---------- misc ---------- */
.soon { opacity: 0.4; position: relative; }
.soon::after {
  content: 'roadmap'; position: absolute; right: 14px; top: 14px;
  font-size: 9px; color: var(--accent-dim);
  border: 1px solid var(--line-strong); padding: 2px 8px;
  border-radius: 0; letter-spacing: 1.4px; text-transform: uppercase;
}
pre.log {
  background: rgba(255,255,255,0.025); border: 1px solid var(--line);
  padding: 12px 14px; border-radius: var(--rad); font-size: 11px;
  max-height: 280px; overflow: auto; white-space: pre-wrap;
  color: rgba(255,255,255,0.72); line-height: 1.6; font-family: var(--mono);
}
video { width: 100%; border-radius: var(--rad); background: #000; border: 1px solid var(--line); }
.muted { color: var(--dim); font-size: 12px; }
.row2 { display: flex; gap: 10px; margin-bottom: 9px; align-items: stretch; }
.row2 > * { flex: 1; min-width: 0; }
.row2 input, .row2 select, .row2 textarea { margin-bottom: 0; }
.inrow { display: flex; gap: 6px; align-items: stretch; }
.inrow input { margin-bottom: 0; }
.inrow button { flex: 0 0 auto; }
.lbl { font-size: 10.5px; color: var(--dim); margin: 8px 0 5px; font-weight: 500; letter-spacing: 0.8px; text-transform: uppercase; }
.hint {
  font-size: 12px; color: var(--dim);
  border: 1px solid var(--line); border-left: 2px solid var(--faint);
  padding: 9px 12px; margin-bottom: 12px; line-height: 1.55;
  background: rgba(255,255,255,0.02);
}
.tag {
  display: inline-block; font-size: 10.5px; padding: 2px 7px;
  background: rgba(175,221,255,0.06); border: 1px solid rgba(175,221,255,0.25);
  color: var(--accent); margin-right: 4px; border-radius: 0;
  font-family: var(--mono); letter-spacing: 0.3px;
}

/* ---------- interactive plates: hover glow + rotating border snake ---------- */
.qs { position: relative; transition: border-color .3s var(--e-out), box-shadow .3s var(--e-out); }
.qs::before {
  content: ''; position: absolute; inset: 0; z-index: -1; border-radius: inherit;
  background: radial-gradient(280px circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,0.08), transparent 65%);
  opacity: 0; transition: opacity .3s var(--e-out);
  pointer-events: none;
}
.qs::after {
  content: ''; position: absolute; inset: -1px; width: auto; height: auto;
  border-radius: inherit; padding: 2px;
  background: conic-gradient(from var(--snake, 0deg),
    transparent 0deg 255deg,
    rgba(186,163,221,0.7) 305deg,
    rgba(255,255,255,0.95) 338deg,
    rgba(255,255,255,0.85) 356deg,
    transparent 360deg);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
          mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
          mask-composite: exclude;
  opacity: 0; transition: opacity .3s var(--e-out);
  pointer-events: none;
}
.qs:hover {
  border-color: rgba(255,255,255,0.4);
  box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 0 24px rgba(186,163,221,0.13), 0 0 70px rgba(158,132,201,0.10);
}
.qs:hover::before, .qs:hover::after { opacity: 1; }

/* --- «Последняя активность»: буквы подсвечиваются при наведении --- */
.act-toggle { color: var(--dim); transition: color .2s var(--e-out), text-shadow .2s var(--e-out); }
details.card:hover .act-toggle { color: var(--txt); text-shadow: 0 0 14px rgba(255,255,255,0.35); }

/* ---------- keyframes ---------- */
@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes pulseDot { 50% { opacity: 0.3; } }
@keyframes toastIn { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- toasts ---------- */
.toast-wrap { position: fixed; bottom: 24px; right: 24px; z-index: 200; display: flex; flex-direction: column; gap: 10px; }
.toast {
  background: rgba(18,18,20,0.92); backdrop-filter: blur(14px);
  border: 1px solid var(--line-strong); border-left: 2px solid var(--txt);
  padding: 11px 16px; min-width: 240px; font-size: 12.5px;
  animation: toastIn 0.35s var(--e-out);
}
.toast.err { border-left-color: var(--err); }
.toast.ok { border-left-color: var(--ok); }

/* ---------- video / images ---------- */
video { width: 100%; border-radius: var(--rad); background: #000; border: 1px solid var(--line); }
img { max-width: 100%; }

/* ---------- aero-shards background (canvas) ---------- */
#bg-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }
#bg-grain {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  opacity: 0.05; mix-blend-mode: screen; background-repeat: repeat;
}

.fx-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 9px; }
.fx-chip {
  font-size: 11px; padding: 4px 10px; border: 1px solid var(--line-strong);
  border-radius: 3px; color: var(--dim); cursor: pointer; user-select: none;
  transition: all .15s var(--e-out);
}
.fx-chip:hover { color: var(--txt); border-color: var(--accent-dim); background: rgba(255,255,255,0.04); }
.fx-chip.on { background: rgba(255,255,255,0.09); color: var(--txt); border-color: rgba(255,255,255,0.5); }

/* ---------- responsive ---------- */
.topbar { display: none; }
@media (max-width: 940px) {
  body { flex-direction: column; }
  aside {
    position: fixed; top: 0; left: 0; z-index: 60;
    transform: translateX(-105%); transition: transform .25s var(--e-out);
    box-shadow: 12px 0 40px rgba(0,0,0,0.6);
  }
  aside.open { transform: none; }
  .topbar {
    display: flex; align-items: center; gap: 12px;
    background: rgba(0,0,0,0.85); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
    padding: 12px 16px; position: sticky; top: 0; z-index: 50;
  }
  .topbar .burger {
    background: transparent; border: 1px solid var(--line-strong);
    color: var(--txt); border-radius: var(--rad); padding: 5px 10px; cursor: pointer;
  }
  .topbar b { font-family: var(--font-display); font-weight: 500; }
  main { padding: 16px; max-width: none; }
  .grid { grid-template-columns: 1fr; }
  .pagehead h2 { font-size: 18px; }
  .card { padding: 14px; }
  .row2 { flex-wrap: wrap; } .row2 > * { min-width: 140px; }
}

/* ============================================================
   v9 patch: утерянные классы после reskin + UX-правки фидбека
   ============================================================ */

/* --- layout: new-episode two-column (text left, settings right) --- */
.new-ep-layout {
  display: grid;
  grid-template-columns: 1.15fr 1fr;
  gap: 22px;
  align-items: start;
}
@media (max-width: 1100px) { .new-ep-layout { grid-template-columns: 1fr; } }

/* --- script toolbar --- */
.script-toolbar { display: flex; gap: 6px; align-items: center; }

/* --- info-tip: restored hover explanations --- */
.info-tip {
  display: inline-flex; align-items: center; justify-content: center;
  width: 14px; height: 14px; border-radius: 50%;
  border: 1px solid var(--line-strong);
  color: var(--faint); font-size: 9px; font-weight: 600;
  cursor: help; position: relative; vertical-align: middle;
  margin-left: 5px; flex-shrink: 0; user-select: none;
}
.info-tip:hover { color: var(--txt); border-color: var(--accent); }
.info-tip:hover::after {
  content: attr(data-tip);
  position: absolute; left: 50%; bottom: calc(100% + 8px);
  transform: translateX(-50%);
  background: rgba(16,16,18,0.97); border: 1px solid var(--line-strong);
  color: var(--txt); font-size: 11.5px; font-weight: 400; line-height: 1.5;
  letter-spacing: 0; text-transform: none;
  padding: 8px 11px; border-radius: var(--rad); white-space: normal;
  width: max-content; max-width: 300px; text-align: left;
  z-index: 100; pointer-events: none;
  box-shadow: 0 10px 30px rgba(0,0,0,0.55);
}

/* --- run table (history) --- */
.run-table { width: 100%; border-collapse: collapse; }
.run-table th { padding: 8px 10px; }
.run-table td { padding: 10px; vertical-align: middle; }
.run-table tr { border-bottom: 1px solid var(--line); transition: background .15s var(--e-out); }
.run-table tbody tr:hover { background: rgba(255,255,255,0.03); }
.r-row td { vertical-align: middle; }
.run-id-pill {
  font-family: var(--mono); font-size: 10px;
  border: 1px solid var(--line-strong); border-radius: 3px;
  padding: 2px 6px; color: var(--dim); white-space: nowrap;
}
.run-title-text { font-size: 13.5px; font-weight: 550; color: var(--txt); }
.run-time-text { font-family: var(--mono); font-size: 11.5px; color: var(--dim); white-space: nowrap; }
.ep-toolbar { display: flex; gap: 6px; justify-content: flex-end; margin-bottom: 20px; }
.mo-on { border-color: rgba(175,221,255,0.55) !important; }
.mo-on:focus { border-color: var(--accent); }

/* --- status dot colors in tables --- */
.st-ok { color: var(--ok); } .st-ok::before { background: var(--ok); }
.st-err { color: var(--err); } .st-err::before { background: var(--err); }
.st-run { color: var(--run); } .st-run::before { background: var(--run); }
.st-idle { color: var(--faint); } .st-idle::before { background: var(--faint); }

/* --- model tags --- */
.model-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; margin-bottom: 10px; }
.model-tag {
  font-family: var(--mono); font-size: 10.5px;
  border: 1px solid var(--line-strong); border-radius: 3px;
  padding: 2px 8px; color: var(--dim);
}

/* --- storyboard --- */
.sb-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.sb-card {
  border: 1px solid var(--line); border-radius: var(--rad);
  background: rgba(255,255,255,0.025); padding: 14px;
  transition: border-color .15s var(--e-out);
}
.sb-card:hover { border-color: var(--line-strong); }
.sb-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.sb-tc { font-family: var(--mono); font-size: 10.5px; color: var(--dim); }
.sb-content { width: 100%; border-radius: var(--rad); border: 1px solid var(--line); display: block; }
.sb-desc { font-size: 12px; color: var(--dim); margin: 8px 0; line-height: 1.5; }
.sb-fx { font-size: 11px; color: var(--dim); font-family: var(--mono); }

/* --- notes --- */
.notes-layout { display: grid; grid-template-columns: 280px 1fr; gap: 16px; align-items: start; }
@media (max-width: 1100px) { .notes-layout { grid-template-columns: 1fr; } }
.notes-list { display: flex; flex-direction: column; gap: 2px; }
.note-item {
  padding: 7px 10px; cursor: pointer; border-radius: var(--rad);
  border-bottom: 1px solid var(--line); font-size: 12.5px;
  transition: background .15s var(--e-out);
}
.note-item:hover { background: rgba(255,255,255,0.045); }

/* --- settings tabs: underline style, NOT sidebar-like buttons --- */
.settings-tabs {
  display: flex; gap: 22px; margin-bottom: 16px;
  border-bottom: 1px solid var(--line); padding-bottom: 0;
}
.settings-tab-btn {
  background: none; border: none; border-bottom: 2px solid transparent;
  color: var(--dim); padding: 6px 2px 10px; cursor: pointer;
  font-size: 12.5px; font-family: var(--font); font-weight: 500;
  transition: color .15s var(--e-out), border-color .15s;
}
.settings-tab-btn:hover { color: var(--txt); }
.settings-tab-btn.active { color: var(--txt); border-bottom-color: var(--accent); }

/* --- studio: scenes full width, symmetric two-column inner grid --- */
#st-scenes { display: grid; grid-template-columns: 1fr; gap: 14px; margin-bottom: 12px; }
.studio-scene {
  border: 1px solid var(--line); background: rgba(255,255,255,0.01);
  border-radius: var(--rad); padding: 14px 18px 16px;
}
.studio-scene:hover { border-color: var(--line-strong); }
.st-grid > div { display: flex; flex-direction: column; }
.st-grid .sc-text, .st-grid .sc-prompt { flex: 1; min-height: 110px; }
.studio-scene .fx-prev { margin: 10px 0 2px; }
.st-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 900px) { .st-grid { grid-template-columns: 1fr; } }
.studio-scene textarea { margin-bottom: 6px; }
#st-scenes { max-width: none; }
.studio-scene .row2 { margin-bottom: 9px; margin-top: auto; }

/* --- uploads --- */
.drop-zone {
  border: 1px dashed var(--line-strong); border-radius: var(--rad);
  padding: 18px; text-align: center; color: var(--dim); font-size: 12px;
  cursor: pointer; transition: border-color .15s, background .15s; margin-bottom: 9px;
}
.drop-zone:hover, .drop-zone.over { border-color: var(--accent-dim); background: rgba(175,221,255,0.03); }

/* --- centered content helper --- */
.center-col { max-width: 980px; margin: 0 auto; }

/* --- status pill text mapping in tables --- */
td .pill { font-size: 10px; }

</style>

  "Вставь готовый текст или загрузи файл .txt, .srt. Если оставить пустым, нейросеть напишет сценарий сама.": ["Вставь готовый текст или загрузи файл .txt, .srt. Если оставить пустым, нейросеть напишет сценарий сама.","Paste a ready script or upload .txt/.srt. Leave empty and the AI writes it.","Pega un guion listo o sube .txt/.srt. Si lo dejas vacío, la IA lo escribe.","粘贴现成脚本或上传 .txt/.srt。留空则 AI 自动写。","तैयार स्क्रिप्ट पेस्ट करें या .txt/.srt अपलोड करें। खाली छोड़ें तो AI लिखेगा।","الصق نصًا جاهزًا أو ارفع .txt/.srt. اتركه فارغًا وستكتبه الذكاء الاصطناعي.","Cole um roteiro pronto ou envie .txt/.srt. Vazio — a IA escreve.","Colle un script prêt ou téléverse un .txt/.srt. Vide — l'IA l'écrit.","Fertiges Skript einfügen oder .txt/.srt hochladen. Leer lassen — die KI schreibt es.","既存スクリプトを貼るか .txt/.srt をアップロード。空欄ならAIが執筆。"],
  "Акценты, персонажи, эпоха, запретные темы или стиль повествования.": ["Акценты, персонажи, эпоха, запретные темы или стиль повествования.","Accents, characters, era, taboo topics or narration style.","Énfasis, personajes, época, temas prohibidos o estilo narrativo.","重点、人物、时代、禁忌话题或叙事风格。","ज़ोर, पात्र, युग, निषिद्ध विषय या कथन शैली।","التركيزات والشخصيات والحقبة والمواضيع المحظورة أو أسلوب السرد.","Ênfases, personagens, época, temas proibidos ou estilo da narração.","Accents, personnages, époque, sujets interdits ou style narratif.","Schwerpunkte, Figuren, Epoche, Tabuthemen oder Erzählstil.","重点、登場人物、時代、避ける話題、語りのスタイル。"],
  "Формат задаёт стиль картинок, темп озвучки, частоту смены кадров и музыку.": ["Формат задаёт стиль картинок, темп озвучки, частоту смены кадров и музыку.","Format defines image style, voice tempo, scene change rate and music.","El formato define estilo de imágenes, ritmo de voz, cambios de escena y música.","格式决定图片风格、语速、换镜频率和音乐。","फ़ॉर्मेट इमेज शैली, वॉइस गति, सीन बदलाव और संगीत तय करता है।","الصيغة تحدد أسلوب الصور وسرعة الصوت وتغيّر المشاهد والموسيقى.","O formato define estilo das imagens, ritmo da voz, troca de cenas e música.","Le format définit le style d'images, le rythme vocal, les changements de scène et la musique.","Das Format legt Bildstil, Sprechtempo, Szenenwechsel und Musik fest.","フォーマットは画像スタイル・音声速度・場面転換・音楽を決定。"],
  "Стилевой пресет промптов и негативов для предотвращения нейрослопа.": ["Стилевой пресет промптов и негативов для предотвращения нейрослопа.","Style preset of prompts and negatives against AI-slop.","Presets de prompts y negativos contra el slop.","防 AI 劣质的提示词与负面词预设。","AI-स्लॉप रोकने हेतु प्रॉम्प्ट/निगेटिव प्रीसेट।","نمط جاهز من البرومبتات والسلبيات ضد إخفاق الذكاء الاصطناعي.","Preset de prompts e negativos contra lixo de IA.","Preset de prompts et négatifs anti-slop IA.","Stil-Presets gegen KI-Müll.","AIスロップ防止のプロンプト/ネガティブpreset。"],
  "Выбор движков для каждого этапа. «по умолч.» использует настроенные параметры.": ["Выбор движков для каждого этапа. «по умолч.» использует настроенные параметры.","Pick engines per stage. Default uses configured ones.","Elige motores por etapa. Por defecto usa los configurados.","每阶段选择引擎。默认用已配置项。","हर चरण हेतु इंजन। डिफ़ॉल्ट कॉन्फ़िगर का उपयोग करता है।","اختر المحرك لكل مرحلة. الافتراضي يستخدم المضبوط.","Escolha motores por etapa. Padrão usa o configurado.","Choisis les moteurs par étape. Défaut = configuré.","Engines pro Stufe wählen. Standard nutzt Konfiguration.","段階ごとにエンジンを選択。既定は設定済みを使用。"],
  "Точная модель для текстовых шагов (сценарий, промпты, метаданные). Провайдер берётся из «Сценарий» выше; здесь выбирается конкретная модель из его списка — кнопкой ↻ обнови список моделей прямо из API, или кликни готовый тег ниже. Оставь пустым — возьмётся модель по умолчанию.": ["Точная модель для текстовых шагов (сценарий, промпты, метаданные). Провайдер берётся из «Сценарий» выше; здесь выбирается конкретная модель из его списка — кнопкой ↻ обнови список моделей прямо из API, или кликни готовый тег ниже. Оставь пустым — возьмётся модель по умолчанию.","Exact model for text steps (script, prompts, metadata). Provider comes from «Script» above; here you pick a concrete model from its list — refresh via ↻ or click a tag. Empty = default model.","Modelo exacto para pasos de texto. El proveedor viene de «Guion» arriba; elige un modelo concreto — ↻ actualiza. Vacío = por defecto.","文本步骤的具体模型。服务商来自上方「脚本」，此处选具体型号，↻ 刷新。留空=默认。","टेक्स्ट चरणों हेतु सटीक मॉडल। प्रोवाइडर ऊपर «स्क्रिप्ट» से; ↻ से सूची रिफ्रेश। खाली = डिफ़ॉल्ट।","النموذج الدقيق لخطوات النص. المزود من «السيناريو» أعلاه؛ ↻ للتحديث. فارغ = الافتراضي.","Modelo exato para etapas de texto. Provedor vem de «Roteiro» acima; ↻ atualiza. Vazio = padrão.","Modèle exact pour les étapes texte. Fournisseur via «Script» ci-dessus; ↻ actualise. Vide = défaut.","Exaktes Modell für Textschritte. Anbieter von «Skript» oben; ↻ aktualisiert. Leer = Standard.","テキスト処理の正確なモデル。プロバイダは上の「スクリプト」から。↻で更新。空欄=デフォルト。"],
  "Конкретный голос внутри провайдера озвучки, выбранного выше («Озвучка»). Кнопкой ↻ подтяни список голосов из API, кликни тег или впиши id вручную. Пусто = дефолтный голос движка. Свои клоны — во вкладке «Голоса».": ["Конкретный голос внутри провайдера озвучки, выбранного выше («Озвучка»). Кнопкой ↻ подтяни список голосов из API, кликни тег или впиши id вручную. Пусто = дефолтный голос движка. Свои клоны — во вкладке «Голоса».","Concrete voice within the TTS provider chosen above. ↻ fetches the voice list; click a tag or type an id. Empty = engine default. Your clones live in the «Voices» tab.","Voz concreta del proveedor TTS elegido arriba. ↻ trae la lista. Vacío = voz por defecto. Tus clones en «Voces».","上方所选配音服务商内的具体声音。↻ 拉取列表。空=引擎默认。克隆见「语音」页。","ऊपर चुने TTS प्रोवाइडर के भीतर ठोस आवाज़। ↻ सूची लाता है। खाली = डिफ़ॉल्ट। क्लोन «आवाज़ें» टैब में।","صوت محدد داخل مزود التعليق المختار أعلاه. ↻ يجلب القائمة. فارغ = الافتراضي. استنساخك في تبويب «الأصوات».","Voz concreta do provedor TTS escolhido acima. ↻ traz a lista. Vazio = padrão. Clones na aba «Vozes».","Voix concrète du fournisseur TTS choisi ci-dessus. ↻ actualise la liste. Vide = voix par défaut. Clones dans l'onglet «Voix».","Konkrete Stimme im oben gewählten TTS-Anbieter. ↻ lädt die Liste. Leer = Standard. Klone im Tab «Stimmen».","上で選んだTTSプロバイダ内の具体的なボイス。↻で一覧取得。空欄=デフォルト。クローンは「ボイス」タブ。"],
  "Путь к папке, куда автоматически скопировать готовое видео, таймкоды, субтитры и обложку.": ["Путь к папке, куда автоматически скопировать готовое видео, таймкоды, субтитры и обложку.","Folder where the finished video, timecodes, subtitles and cover are copied automatically.","Carpeta donde se copian vídeo, timecodes, subtítulos y portada.","成片、时间码、字幕和封面自动复制到的文件夹。","जहाँ तैयार वीडियो, टाइमकोड, सबटाइटल व कवर अपने आप कॉपी हों।","مجلد تُنسخ إليه تلقائيًا الفيديو والتوقيتات والترجمات والغلاف.","Pasta onde vídeo, timecodes, legendas e capa são copiados.","Dossier où vidéo, timecodes, sous-titres et couverture sont copiés.","Ordner, in den Video, Timecodes, Untertitel und Cover kopiert werden.","完成動画・タイムコード・字幕・カバーを自動コピーするフォルダ。"],
  "LLM оценит тайтл по вирусным критериям, укажет слабые места и предложит 3 альтернативы.": ["LLM оценит тайтл по вирусным критериям, укажет слабые места и предложит 3 альтернативы.","LLM scores the title by viral criteria, flags weaknesses and offers 3 alternatives.","La LLM puntúa el título, señala fallos y da 3 alternativas.","LLM 按爆款标准评分标题，指出弱点并给 3 个备选。","LLM वायरल मानदंडों पर टाइटल स्कोर करेगा, कमियाँ बताएगा, 3 विकल्प देगा।","يقيّم نموذج LLM العنوان بمعايير الانتشار ويقترح 3 بدائل.","A LLM pontua o título por critérios virais e sugere 3 alternativas.","Le LLM note le titre selon des critères viraux et propose 3 alternatives.","Die LLM bewertet den Titel viral und schlägt 3 Alternativen vor.","LLMがバイラル基準でタイトルを採点し、代替案を3つ提案。"],
  "Прослушать, как звучит выбранный голос: синтезирует короткую пробную фразу.": ["Прослушать, как звучит выбранный голос: синтезирует короткую пробную фразу.","Hear the selected voice: synthesizes a short sample.","Escucha la voz elegida: sintetiza una muestra corta.","试听所选声音：合成一小段。","चुनी आवाज़ सुनें: छोटा नमूना सिंथ करता है।","استمع للصوت المختار: يركّب مقطعًا قصيرًا.","Ouça a voz escolhida: sintetiza uma amostra curta.","Écouter la voix choisie : synthétise un court échantillon.","Gewählte Stimme anhören: synthetisiert eine kurze Probe.","選んだ声を試聴：短いサンプルを合成。"],

  "Гайд: 1) выбери шаблон и формат кадра — поля ниже меняются под шаблон; 2) заполни их обычными словами; 3) укажи длительность в секундах; 4) «Создать и отрендерить» — mp4 появится ниже, его можно скачать. Всё считается локально и бесплатно.": ["Гайд: 1) выбери шаблон и формат кадра — поля ниже меняются под шаблон; 2) заполни их обычными словами; 3) укажи длительность в секундах; 4) «Создать и отрендерить» — mp4 появится ниже, его можно скачать. Всё считается локально и бесплатно.","Guide: 1) pick a template and frame format — the fields below adapt; 2) fill them in plain words; 3) set duration in seconds; 4) «Create & render» — the mp4 appears below and can be downloaded. Everything renders locally, free.","Guía: 1) elige plantilla y formato — los campos se adaptan; 2) rellénalos en palabras simples; 3) duración en segundos; 4) «Crear y renderizar» — el mp4 aparece abajo. Todo local y gratis.","指南：1) 选模板与画幅——下方字段随模板变化；2) 用普通文字填写；3) 设秒数；4)「创建并渲染」——mp4 在下方出现。全部本地免费。","गाइड: 1) टेम्पलेट व फ़ॉर्मेट चुनें — फ़ील्ड बदलते हैं; 2) साधारण शब्दों में भरें; 3) सेकंड; 4) «बनाएँ व रेंडर» — mp4 नीचे। सब लोकल मुफ़्त।","دليل: 1) اختر القالب والصيغة — الحقول تتكيف؛ 2) املأ بكلمات عادية؛ 3) المدة بالثواني؛ 4) «أنشئ وارندر» — يظهر mp4 أدناه. كله محلي مجاني.","Guia: 1) escolha template e formato — os campos se adaptam; 2) preencha em palavras simples; 3) duração em segundos; 4) «Criar e renderizar» — o mp4 aparece abaixo. Tudo local, grátis.","Guide : 1) choisis modèle et format — les champs s'adaptent ; 2) remplis simplement ; 3) durée en secondes ; 4) «Créer & rendre» — le mp4 s'affiche. Tout local, gratuit.","Anleitung: 1) Template und Format wählen — Felder passen sich an; 2) einfach ausfüllen; 3) Dauer in Sekunden; 4) «Erstellen & rendern» — mp4 erscheint unten. Alles lokal, gratis.","ガイド：1) テンプレとフォーマットを選択 — 項目が変わる；2) 普通の言葉で記入；3) 秒数；4)「作成してレンダリング」— mp4が下に表示。全てローカル無料。"],

  'Референсы — это образцы стиля, которые ты загружаешь сам: картинка, видео или ссылка. Они НЕ подставляются в генерацию автоматически — держи их перед глазами, когда пишешь промпты и выбираешь визуальный пресет. Здесь появляются только те, что добавил ты.': ['Референсы — это образцы стиля, которые ты загружаешь сам: картинка, видео или ссылка. Они НЕ подставляются в генерацию автоматически — держи их перед глазами, когда пишешь промпты и выбираешь визуальный пресет. Здесь появляются только те, что добавил ты.','References are style samples you upload yourself: an image, video or link. They are NOT injected into generation automatically — keep them in mind when writing prompts and choosing a visual preset. Only the ones you add appear here.','Las referencias son muestras de estilo que subes tú: imagen, vídeo o enlace. NO se inyectan automáticamente — tenlas a mano al escribir prompts y elegir preset. Solo aparecen las que añadas.','参考是你自己上传的风格样本。不会自动进入生成——写提示词和选预设时作为参考。只显示你添加的。','रेफ़रेंस आपके अपलोड किए स्टाइल नमूने हैं। जनरेशन में अपने आप नहीं जाते — प्रॉम्प्ट/प्रीसेट लिखते समय सामने रखें। केवल जोड़े हुए दिखते हैं।','المراجع عينات أسلوب ترفعها بنفسك: صورة أو فيديو أو رابط. لا تُدخل في التوليد تلقائيًا — استعن بها عند كتابة البرومبتات واختيار النمط. تظهر فقط ما أضفته.','Referências são amostras de estilo que você envia: imagem, vídeo ou link. NÃO entram na geração automaticamente — use ao escrever prompts e escolher preset. Só aparecem as que você adicionar.','Les références sont des échantillons de style que tu téléverses : image, vidéo ou lien. Elles ne sont PAS injectées automatiquement — garde-les sous les yeux pour les prompts et presets. Seules celles ajoutées apparaissent.','Referenzen sind selbst hochgeladene Stilproben: Bild, Video oder Link. Sie fließen NICHT automatisch in die Generierung ein — beim Schreiben von Prompts und Presets beachten. Nur hinzugefügte erscheinen.','リファレンスは自分でアップロードするスタイル見本。生成に自動反映されない — プロンプトやプリセット選択時に参考に。追加したものだけ表示。'],

  "Лицензионная политика: ядро — только официальные API (чисто для open-source релиза). Скраперы TikTok/Google Trends — зона community-плагинов. Нужен YOUTUBE_API_KEY в .env (бесплатно, тот же Google Cloud проект).": ["Лицензионная политика: ядро — только официальные API (чисто для open-source релиза). Скраперы TikTok/Google Trends — зона community-плагинов. Нужен YOUTUBE_API_KEY в .env (бесплатно, тот же Google Cloud проект).", "Licensing policy: the core uses official APIs only (clean for the open-source release). TikTok/Google Trends scrapers belong to community plugins. Needs YOUTUBE_API_KEY in .env (free, same Google Cloud project).", "Política de licencias: el núcleo usa solo APIs oficiales (limpio para el release open-source). Los scrapers de TikTok/Google Trends son zona de plugins comunitarios. Necesita YOUTUBE_API_KEY en .env (gratis, mismo proyecto de Google Cloud).", "许可政策：核心只用官方 API（保证开源发布干净）。TikTok/Google Trends 爬虫属社区插件。需在 .env 配置 YOUTUBE_API_KEY（免费，同一 Google Cloud 项目）。", "लाइसेंसिंग नीति: कोर केवल आधिकारिक API (open-source रिलीज़ हेतु साफ़)। TikTok/Google Trends स्क्रैपर — community-प्लगइन क्षेत्र। .env में YOUTUBE_API_KEY चाहिए (मुफ़्त, वही Google Cloud प्रोजेक्ट)।", "سياسة التراخيص: النواة تستخدم الواجهات الرسمية فقط (نظافة للإصدار المفتوح). الكاشطات لـ TikTok/Google Trends نطاق الإضافات المجتمعية. يتطلب YOUTUBE_API_KEY في .env (مجاني، نفس مشروع Google Cloud).", "Política de licenciamento: o núcleo usa só APIs oficiais (limpo para o release open-source). Scrapers de TikTok/Google Trends são zona de plugins comunitários. Precisa de YOUTUBE_API_KEY no .env (grátis, mesmo projeto Google Cloud).", "Politique de licences : le cœur n'utilise que des API officielles (propre pour la release open-source). Les scrapers TikTok/Google Trends relèvent des plugins communautaires. Nécessite YOUTUBE_API_KEY dans .env (gratuit, même projet Google Cloud).", "Lizenzpolitik: Der Kern nutzt nur offizielle APIs (sauber für das Open-Source-Release). TikTok/Google-Trends-Scraper sind Community-Plugin-Territorium. YOUTUBE_API_KEY in .env nötig (kostenlos, gleiches Google-Cloud-Projekt).", "ライセンス方針：コアは公式APIのみ（オープンソース公開のため）。TikTok/Google Trendsのスクレイパーはコミュニティプラグイン領域。.envにYOUTUBE_API_KEYが必要（無料、同じGoogle Cloudプロジェクト）。"],

  "плагин = папка в community_plugins/имя/ с файлом plugin.json (поля id, name, type — provider или tool, entry — файл входа). Вставь JSON-манифест ниже — папка создастся; код плагина положи рядом. MCP-сервер поверх ядра — этап 2 (P2); чужие MCP подключаются в клиенте напрямую.": ["плагин = папка в community_plugins/имя/ с файлом plugin.json (поля id, name, type — provider или tool, entry — файл входа). Вставь JSON-манифест ниже — папка создастся; код плагина положи рядом. MCP-сервер поверх ядра — этап 2 (P2); чужие MCP подключаются в клиенте напрямую.", "a plugin = folder in community_plugins/<name>/ with a plugin.json (fields id, name, type — provider or tool, entry — entry file). Paste a JSON manifest below — the folder will be created; put the plugin code next to it. MCP server over the core — stage 2 (P2); third-party MCPs connect in the client directly.", "un plugin = carpeta en community_plugins/<nombre>/ con plugin.json (campos id, name, type — provider o tool, entry — archivo de entrada). Pega un manifiesto JSON abajo — la carpeta se creará; el código va al lado. Servidor MCP sobre el núcleo — etapa 2 (P2); los MCP externos se conectan en el cliente.", "插件＝community_plugins/<名称>/ 文件夹 + plugin.json（字段 id、name、type—provider 或 tool，entry—入口文件）。在下方粘贴 JSON 清单即会建目录；插件代码放在旁边。核心之上的 MCP 服务器属阶段 2（P2）；第三方 MCP 在客户端直连。", "प्लगइन = community_plugins/<नाम>/ फ़ोल्डर + plugin.json (फ़ील्ड id, name, type — provider या tool, entry — एंट्री फ़ाइल)। नीचे JSON मैनिफेस्ट पेस्ट करें — फ़ोल्डर बनेगा; कोड पास रखें। कोर पर MCP सर्वर — चरण 2 (P2); तीसरे पक्ष के MCP क्लाइंट में सीधे जुड़ते हैं।", "الإضافة = مجلد في community_plugins/<اسم>/ مع plugin.json (الحقول id وname وtype — provider أو tool، وentry — ملف الدخول). الصق مانيفست JSON أدناه — سيُنشأ المجلد؛ ضع الكود بجانبه. خادم MCP فوق النواة — المرحلة 2 (P2)؛ وMCP الخارجية تتصل من العميل مباشرة.", "um plugin = pasta em community_plugins/<nome>/ com plugin.json (campos id, name, type — provider ou tool, entry — arquivo de entrada). Cole um manifesto JSON abaixo — a pasta será criada; o código vai ao lado. Servidor MCP sobre o núcleo — etapa 2 (P2); MCPs de terceiros conectam no cliente.", "un plugin = dossier dans community_plugins/<nom>/ avec plugin.json (champs id, name, type — provider ou tool, entry — fichier d'entrée). Colle un manifeste JSON ci-dessous — le dossier sera créé ; le code va à côté. Serveur MCP sur le cœur — étape 2 (P2) ; les MCP tiers se connectent dans le client.", "ein Plugin = Ordner in community_plugins/<name>/ mit plugin.json (Felder id, name, type — provider oder tool, entry — Einstiegsdatei). JSON-Manifest unten einfügen — der Ordner entsteht; den Code daneben. MCP-Server über dem Kern — Phase 2 (P2); fremde MCPs verbinden sich direkt im Client.", "プラグイン＝community_plugins/<名>/ フォルダ＋plugin.json（id・name・type—providerかtool、entry—入口ファイル）。下にJSONマニフェストを貼るとフォルダ生成；コードは隣に。コア上のMCPサーバはフェーズ2（P2）；第三者MCPはクライアントから直接接続。"],

  "Реальная музыка — через провайдеров в форме выпуска («Музыка:»): openverse_music — CC-поиск без ключа; jamendo_music и freesound_music — бесплатные ключи в .env; library_music — свои треки из библиотеки ниже. ambient_synth — локальный процедурный фон на крайний случай. Готовых mood-пресетов больше нет.": ["Реальная музыка — через провайдеров в форме выпуска («Музыка:»): openverse_music — CC-поиск без ключа; jamendo_music и freesound_music — бесплатные ключи в .env; library_music — свои треки из библиотеки ниже. ambient_synth — локальный процедурный фон на крайний случай. Готовых mood-пресетов больше нет.", "Real music comes from the providers in the episode form («Music:»): openverse_music — CC search, no key; jamendo_music and freesound_music — free keys in .env; library_music — your own tracks from the library below. ambient_synth — local procedural bed as a last resort. Ready-made mood presets are gone.", "La música real viene de los proveedores del formulario («Música:»): openverse_music — búsqueda CC sin clave; jamendo_music y freesound_music — claves gratis en .env; library_music — tus pistas de la biblioteca de abajo. ambient_synth — fondo procedural local de reserva. Ya no hay presets de mood.", "Настоящая музыка — через провайдеров в форме выпуска («Музыка»): openverse_music — CC 搜索免密钥；jamendo_music 和 freesound_music — .env 里的免费密钥；library_music — 下方库中自己的曲目。ambient_synth — 本地程序化背景音，备用。不再有现成 mood 预设。", "असली संगीत — एपिसोड फ़ॉर्म के प्रोवाइडर से («संगीत»): openverse_music — बिना कुंजी CC सर्च; jamendo_music व freesound_music — .env में मुफ़्त कुंजियाँ; library_music — नीचे लाइब्रेरी के अपने ट्रैक। ambient_synth — लोकल प्रोसीजरल बैकग्राउंड, आख़िरी विकल्प। तैयार mood-प्रीसेट अब नहीं।", "الموسيقى الحقيقية — عبر مزودي نموذج الحلقة («الموسيقى»): openverse_music — بحث CC بلا مفتاح؛ jamendo_music و freesound_music — مفاتيح مجانية في .env؛ library_music — مقاطعك من المكتبة أدناه. ambient_synth — خلفية إجرائية محلية كخيار أخير. لم تعد هناك إعدادات mood جاهزة.", "Música real — pelos provedores no formulário («Música»): openverse_music — busca CC sem chave; jamendo_music e freesound_music — chaves grátis no .env; library_music — suas faixas da biblioteca abaixo. ambient_synth — fundo procedural local como último recurso. Não há mais presets de mood.", "La vraie musique — via les fournisseurs du formulaire («Musique») : openverse_music — recherche CC sans clé ; jamendo_music et freesound_music — clés gratuites dans .env ; library_music — tes pistes de la bibliothèque ci-dessous. ambient_synth — fond procédural local en dernier recours. Fini les presets de mood.", "Echte Musik — über die Anbieter im Episodenformular («Musik»): openverse_music — CC-Suche ohne Key; jamendo_music und freesound_music — kostenlose Keys in .env; library_music — eigene Tracks aus der Bibliothek unten. ambient_synth — lokale prozedurale Kulanz als Notfall. Fertige Mood-Presets gibt es nicht mehr.", "本物の音楽は新規フォームのプロバイダで（「音楽」）：openverse_music — キー不要のCC検索；jamendo_musicとfreesound_music — .envの無料キー；library_music — 下のライブラリの自前トラック。ambient_synth — 最後の手段のローカル手続き的背景音。moodプリセットは廃止。"],
  "Как пользоваться:": ["Как пользоваться:", "How to use:", "Cómo usar:", "使用方法：", "कैसे उपयोग करें:", "كيفية الاستخدام:", "Como usar:", "Mode d'emploi :", "So wird's genutzt:", "使い方："],
  "1. Выбери шаблон и формат кадра (16:9 — YouTube, 9:16 — Shorts/Reels, 1:1 — посты).": ["1. Выбери шаблон и формат кадра (16:9 — YouTube, 9:16 — Shorts/Reels, 1:1 — посты).", "1. Pick a template and frame format (16:9 — YouTube, 9:16 — Shorts/Reels, 1:1 — posts).", "1. Elige plantilla y formato de fotograma (16:9 — YouTube, 9:16 — Shorts/Reels, 1:1 — posts).", "1. 选择模板与画幅（16:9—YouTube、9:16—Shorts/Reels、1:1—帖子）。", "1. टेम्पलेट व फ़्रेम फ़ॉर्मेट चुनें (16:9 — YouTube, 9:16 — Shorts/Reels, 1:1 — पोस्ट)।", "1. اختر القالب وصيغة الإطار (16:9 — يوتيوب، 9:16 — شورتس/ريلز، 1:1 — منشورات).", "1. Escolha template e formato do quadro (16:9 — YouTube, 9:16 — Shorts/Reels, 1:1 — posts).", "1. Choisis un modèle et le format de l'image (16:9 — YouTube, 9:16 — Shorts/Reels, 1:1 — posts).", "1. Wähle Template und Bildformat (16:9 — YouTube, 9:16 — Shorts/Reels, 1:1 — Posts).", "1. テンプレートとフレーム形式を選択（16:9 — YouTube、9:16 — Shorts/Reels、1:1 — 投稿）。"],
  "2. Заполни подсвеченные поля шаблона обычными словами — остальные необязательны.": ["2. Заполни подсвеченные поля шаблона обычными словами — остальные необязательны.", "2. Fill the highlighted template fields in plain words — the rest are optional.", "2. Rellena los campos resaltados de la plantilla con palabras simples — el resto es opcional.", "2. 用平常的话填写高亮的模板字段——其余可选。", "2. हाइलाइट किए टेम्पलेट फ़ील्ड साधारण शब्दों में भरें — बाकी वैकल्पिक।", "2. املأ حقول القالب المميزة بكلمات عادية — الباقي اختياري.", "2. Preencha os campos destacados do template com palavras simples — o resto é opcional.", "2. Remplis les champs surlignés du modèle simplement — les autres sont optionnels.", "2. Fülle die hervorgehobenen Template-Felder in einfachen Worten — der Rest ist optional.", "2. ハイライトされたテンプレート項目を普通の言葉で記入——他は任意。"],
  "3. Укажи длительность в секундах и нажми «Создать и отрендерить» — mp4 появится ниже. Всё считается локально и бесплатно.": ["3. Укажи длительность в секундах и нажми «Создать и отрендерить» — mp4 появится ниже. Всё считается локально и бесплатно.", "3. Set the duration in seconds and hit «Create & render» — the mp4 appears below. Everything runs locally, free.", "3. Indica la duración en segundos y pulsa «Crear y renderizar» — el mp4 aparece abajo. Todo local y gratis.", "3. 填写秒数并点「创建并渲染」——mp4 将出现在下方。全部本地免费。", "3. सेकंड में अवधि दें और «बनाएँ व रेंडर» दबाएँ — mp4 नीचे आएगा। सब लोकल व मुफ़्त।", "3. حدد المدة بالثواني واضغط «أنشئ وارندر» — سيظهر mp4 أدناه. كل شيء محلي ومجاني.", "3. Defina a duração em segundos e clique «Criar e renderizar» — o mp4 aparece abaixo. Tudo local e grátis.", "3. Indique la durée en secondes et cliquez «Créer & rendre» — le mp4 s'affiche ci-dessous. Tout est local et gratuit.", "3. Dauer in Sekunden angeben und «Erstellen & rendern» klicken — das mp4 erscheint unten. Alles lokal und kostenlos.", "3. 秒数を入れて「作成してレンダリング」— mp4が下に表示。すべてローカルで無料。"],

  "Подсвечены поля, которые использует выбранный шаблон; пустые поля в рендер не идут.": ["Подсвечены поля, которые использует выбранный шаблон; пустые поля в рендер не идут.", "The fields used by the selected template are highlighted; empty fields are skipped in the render.", "Los campos que usa la plantilla elegida están resaltados; los vacíos no entran al render.", "高亮的是所选模板使用的字段；空字段不参与渲染。", "चयनित टेम्पलेट जो फ़ील्ड उपयोग करता है वे हाइलाइट हैं; खाली फ़ील्ड रेंडर में नहीं जाते।", "الحقول التي يستخدمها القالب المحدد مميزة؛ الحقول الفارغة لا تدخل في الرندر.", "Os campos usados pelo template escolhido estão destacados; vazios ficam de fora do render.", "Les champs utilisés par le modèle choisi sont surlignés ; les vides ne sont pas rendus.", "Die Felder des gewählten Templates sind hervorgehoben; leere Felder landen nicht im Render.", "選択したテンプレートが使う項目はハイライト；空欄はレンダリングされません。"],

async function api(path, opts) {
  try {
    let url = path;
    const tok = localStorage.getItem('ui_token') || '';
    if (tok && url.startsWith('/api/')) url += (url.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(tok);
    const r = await fetch(url, opts);
    if (r.status === 401 && !(opts && opts.__retried)) {
      const tok = prompt(t('Требуется токен доступа (UI_TOKEN из .env):'));
      if (tok) { localStorage.setItem('ui_token', tok.trim()); return api(path, Object.assign({}, opts, {__retried: true})); }
    }
    return await r.json();
  }
  catch(e) { return {ok:false, error:e.message}; }
}

function formatTimecode(sec) {
  if (!sec && sec !== 0) return '00:00:00';
  const s = Math.round(sec);
  const hh = Math.floor(s / 3600);
  const mm = Math.floor((s % 3600) / 60);
  const ss = s % 60;
  return `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
}

    const cancelBtn = prog.querySelector('#run-cancel');
    if (cancelBtn) cancelBtn.style.display = active ? 'inline-flex' : 'none';
    if ((r.steps || []).some(s => s.status === 'running' || s.status === 'pending') || r.queued) prog.open = true;
    else clearInterval(progTimer);
    const rawEl = document.getElementById('run-progress-raw');
    if (rawEl && r.log_tail) rawEl.textContent = r.log_tail;
  }
  const progTimer = setInterval(pollProgress, 3000);
  const cancelBtn = prog.querySelector('#run-cancel');
  if (cancelBtn) cancelBtn.onclick = async () => {
    if (!confirm(t('Отменить прогон?'))) return;
    cancelBtn.disabled = true;
    const r = await api(`/api/run/${runId}/cancel`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}'});
    cancelBtn.disabled = false;
    const msg = prog.querySelector('#run-cancel-msg');
    if (r.ok) { msg.textContent = t('Прогон отменён, кредит возвращён'); toast(t('Прогон отменён, кредит возвращён'), 'ok'); setTimeout(() => { show('dash', true); }, 1200); }
    else msg.textContent = r.error || t('ошибка');
  };
  api(`/api/run/${runId}/progress`).then(r => {
    if (r.ok) prog.querySelector('summary').textContent =
      t('rc.progress') + ' — ' + (r.steps || []).filter(s => s.status === 'done').length + '/' + (r.steps || []).length;
  });

  // Metadata + publish (title/description/tags + one-click YouTube)
  const metaCard = el(`<div class="card" id="pub-card" style="display:none">
    <h3>${t('rc.meta.pub')}</h3>
    <div class="lbl" style="margin-top:0">${t('rc.m.title')}</div>
    <div style="display:flex;gap:8px">
      <input id="pub-title" style="margin-bottom:8px">
      <button class="btn btn-secondary btn-sm" id="pub-title-copy" style="flex:0 0 auto">${t('c.copy')}</button>
    </div>
    <div class="lbl">${t('rc.m.desc')}</div>
    <textarea id="pub-desc" rows="4"></textarea>
    <div style="display:flex;gap:8px;align-items:flex-start">
      <div style="flex:1">
        <div class="lbl">${t('rc.m.tags')}</div>
        <input id="pub-tags">
      </div>
      <div style="flex:0 0 auto;padding-top:26px">
        <button class="btn btn-secondary btn-sm" id="pub-desc-copy">${t('rc.copy.all')}</button>
      </div>
    </div>
    <div style="display:flex;gap:10px;align-items:center;margin-top:12px">
      <select id="pub-visibility" style="flex:0 0 260px;margin-bottom:0">
        <option value="unlisted">${t('unlisted — по ссылке (безопасно)')}</option>
        <option value="public">public</option>
        <option value="private">private</option>
      </select>
      <button class="btn btn-primary btn-sm" id="pub-go">${t('rc.publish')}</button>
      <input type="datetime-local" id="pub-at" style="flex:0 0 220px;margin-bottom:0" title="${t('дата и время выхода')}">
      <button class="btn btn-secondary btn-sm" id="pub-sched">${t('rc.schedule')}</button>
      <span class="muted" id="pub-status"></span>
    </div>
    <div class="hint" style="margin:12px 0 0">${t('Публикация идёт через OAuth: если аккаунт ещё не привязан — Инструменты → «Привязать аккаунт Google»; при первой публикации откроется окно входа Google.')}</div>
  </div>`);
  m.appendChild(metaCard);
  api(`/api/run/${runId}/metadata`).then(md => {
    if (!md || md.error) return;
    metaCard.style.display = 'block';
    metaCard.querySelector('#pub-title').value = md.title || '';
    metaCard.querySelector('#pub-desc').value = md.description || '';
    const tg = md.tags;
    metaCard.querySelector('#pub-tags').value = Array.isArray(tg) ? tg.join(', ') : String(tg || '');
  });
  const metaCopy = (id, getText) => metaCard.querySelector('#' + id).onclick = async () => {
    const t = getText();
    if (!t) return;
    if (navigator.clipboard) { await navigator.clipboard.writeText(t); toast(t('скопировано в буфер'), 'ok'); }
  };
  metaCopy('pub-title-copy', () => metaCard.querySelector('#pub-title').value);
  metaCopy('pub-desc-copy', () => {
    const d = metaCard.querySelector('#pub-desc').value;
    const tags = metaCard.querySelector('#pub-tags').value;
    return d + (tags ? '\n\n' + tags : '');
  });
  metaCard.querySelector('#pub-go').onclick = async () => {
    const b = metaCard.querySelector('#pub-go'), st = metaCard.querySelector('#pub-status');
    const vis = metaCard.querySelector('#pub-visibility').value;
    if (!confirm(`${t('Опубликовать')} ${runId} → YouTube (${vis})?`)) return;
    b.disabled = true; st.textContent = t('запускаю публикацию…');
    const r = await api(`/api/run/${runId}/publish`, {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({visibility: vis})});
    b.disabled = false;
    st.textContent = r.ok ? t('запущено — прогресс в «Ходе прогона»') : (r.error || t('ошибка'));
  };
  metaCard.querySelector('#pub-sched').onclick = async () => {
    const b = metaCard.querySelector('#pub-sched'), st = metaCard.querySelector('#pub-status');
    const val = metaCard.querySelector('#pub-at').value;
    if (!val) { st.textContent = t('выбери дату и время'); return; }
    const iso = new Date(val).toISOString();
    if (!confirm(t('Запланировать выход') + ' ' + runId + ' — ' + new Date(iso).toLocaleString() + '?')) return;
    b.disabled = true; st.textContent = t('планирую…');
    const r = await api(`/api/run/${runId}/publish`, {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({publish_at: iso, visibility: 'private'})});
    b.disabled = false;
    st.textContent = r.ok ? t('запланировано — YouTube опубликует в назначенное время') : (r.error || t('ошибка'));
  };

  // Main video player if exists
  if (pdata.has_video) {
    const vcard = el(`<div class="card" style="padding:16px">
      <video id="studio-video" controls style="max-height:540px;width:100%;border-radius:8px">
        <source src="${pdata.video_url}?t=${Date.now()}" type="video/mp4">
      </video>
    </div>`);
    m.appendChild(vcard);
  }

  // Interactive Storyboard Section
  const sbCard = el(`<div class="card">
    <h3>
      <span> ${t('Интерактивная раскадровка кадров')} (${pdata.scenes ? pdata.scenes.length : 0})</span>
      <span class="info-tip" data-tip="${t('Кликни по любому кадру для редактирования промпта, смены эффекта камеры или доработки с ИИ.')}">?</span>
    </h3>
    <div class="sb-container" id="sb-grid"></div>
  </div>`);

  const grid = sbCard.querySelector('#sb-grid');
  const scenes = pdata.scenes || [];
  
  // Inspector & Prompt Refiner card
  const inspectorCard = el(`<div class="card" id="scene-inspector" style="border-color:var(--line-strong)">
    <h3>
      <span id="ins-title">${t('Редактор выбранной сцены')}</span>
      <span class="info-tip" data-tip="${t('Изменится только этот конкретный кадр. Видео пересоберётся мгновенно без повторного прогона остальных сцен.')}">?</span>
    </h3>
    
    <div style="display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start">
      <div>
        <img id="ins-img" style="width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;border:1px solid var(--line)" src="">
        <div style="margin-top:10px;display:flex;justify-content:space-between;align-items:center">
          <span id="ins-tc-range" class="tag" style="font-family:var(--mono);color:#93c5fd">00:00:00 - 00:00:00</span>
          <button class="btn btn-secondary btn-sm" id="ins-play-audio">▶ ${t('Аудио сцены')}</button>
        </div>
        <div style="margin-top:8px">
          <input type="file" id="ins-file" accept=".png,.jpg,.jpeg,.webp" style="display:none">
          <button class="btn btn-secondary btn-sm" id="ins-upload" style="width:100%">${t('Загрузить свой кадр')}</button>
        </div>
      </div>

      <div>
        <div class="row2">
          <div>
            <div class="lbl">${t('st.motion')}</div>
            <select id="ins-effect">
              <option value="zoom_in">${t("Плавный наезд")} · zoom_in</option>
              <option value="zoom_out">${t("Плавный отъезд")} · zoom_out</option>
              <option value="pan_left_right">${t("Панорама слева направо")} · pan_left_right</option>
              <option value="pan_right_left">${t("Панорама справа налево")} · pan_right_left</option>
              <option value="tilt_up">${t("Наклон снизу вверх")} · tilt_up</option>
              <option value="tilt_down">${t("Наклон сверху вниз")} · tilt_down</option>
              <option value="handheld_drift">${t("Дыхание ручной камеры")} · handheld_drift</option>
              <option value="locked_off">${t("Статичный кадр")} · locked_off</option>
              <option value="diagonal_drift">${t("Диагональная проводка")} · diagonal_drift</option>
            </select>
            <div class="lbl">${t('st.overlays')}</div>
            <div class="fx-chips" id="ins-chips">
              <span class="fx-chip" data-fx="film_grain">${t("Зерно 35мм")}</span>
              <span class="fx-chip" data-fx="vignette_focus">${t("Виньетка")}</span>
              <span class="fx-chip" data-fx="cinematic_contrast">${t("Контраст")}</span>
              <span class="fx-chip" data-fx="warm_grade">${t("Тёплый град")}</span>
              <span class="fx-chip" data-fx="cold_night">${t("Холодная ночь")}</span>
              <span class="fx-chip" data-fx="faded_film">${t("Выцветшая плёнка")}</span>
              <span class="fx-chip" data-fx="sepia_archive">${t("Сепия-архив")}</span>
              <span class="fx-chip" data-fx="letterbox_cine">${t("Кинемат. полосы")}</span>
              <span class="fx-chip" data-fx="sharpen">${t("Резкость")}</span>
            </div>
          </div>
          <div>
            <div class="lbl">${t('Текст диктора этой сцены')}</div>
            <input id="ins-text" placeholder="${t('Текст диктора...')}">
          </div>
        </div>

        <div class="lbl">${t('Промпт картинки (или пожелание по изменению)')}</div>
        <textarea id="ins-prompt" rows="3" placeholder="${t('Опиши, что изменить (например: добавить ночной дождь и отблески факелов на шлеме)...')}"></textarea>

        <div style="display:flex;gap:10px;align-items:center;margin-top:8px">
          <button class="btn btn-secondary" id="ins-ai-enhance"> ${t('Доработать промпт с ИИ')}</button>
          <button class="btn btn-primary" id="ins-apply-btn"> ${t('Пересобрать кадр и видео')}</button>
          <span id="ins-status" class="muted" style="margin-left:8px"></span>
        </div>
        <div id="ins-rationale" style="display:none;background:#090b12;border:1px solid #1e2538;border-radius:8px;padding:10px 14px;margin-top:10px;font-size:12px;color:#93c5fd"></div>
      </div>
    </div>
  </div>`);

  function selectScene(idx) {
    S.selectedScene = idx;
    grid.querySelectorAll('.sb-card').forEach((c, i) => c.classList.toggle('selected', i === idx));
    const sc = scenes[idx];
    if (!sc) return;
    inspectorCard.querySelector('#ins-title').textContent = `${t('Сцена')} #${sc.index} (${sc.scene_id}) · ${sc.timecode_range || formatTimecode(sc.start) + ' - ' + formatTimecode(sc.end)}`;
    inspectorCard.querySelector('#ins-img').src = sc.asset_url || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 9"><rect width="16" height="9" fill="%23121520"/></svg>';
    inspectorCard.querySelector('#ins-tc-range').textContent = sc.timecode_range || `${formatTimecode(sc.start)} - ${formatTimecode(sc.end)}`;
    const fx = splitFx(sc.effect);
    inspectorCard.querySelector('#ins-effect').value = fx.motion;
    inspectorCard.querySelectorAll('#ins-chips .fx-chip').forEach(ch => ch.classList.toggle('on', fx.on.includes(ch.dataset.fx)));
    sc._origFx = sc.effect || 'zoom_in';
    sc._origPrompt = sc.prompt || '';
    inspectorCard.querySelector('#ins-text').value = sc.text || '';
    inspectorCard.querySelector('#ins-prompt').value = sc.prompt || '';
    inspectorCard.querySelector('#ins-status').textContent = '';
    inspectorCard.querySelector('#ins-rationale').style.display = 'none';

    inspectorCard.querySelector('#ins-play-audio').onclick = () => {
      if (sc.audio_url) new Audio(sc.audio_url).play();
      else alert(t('Аудиофайл для этой сцены ещё не сформирован.'));
    };
  }

  // Populate storyboard cards
  scenes.forEach((sc, i) => {
    const card = document.createElement('div');
    card.className = 'sb-card' + (i === 0 ? ' selected' : '');
    const tcRange = sc.timecode_range || `${formatTimecode(sc.start)} - ${formatTimecode(sc.end)}`;
    card.innerHTML = `
      <img src="${sc.asset_url || 'data:image/svg+xml,<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 16 9\"><rect width=\"16\" height=\"9\" fill=\"%23121520\"/></svg>'}" alt="Scene ${sc.index}">
      <div class="sb-content">
        <div class="sb-header">
          <span class="sb-tc">${tcRange}</span>
          <span class="sb-fx">${sc.effect}</span>
        </div>
        <div class="sb-desc" title="${esc(sc.text || '')}">${esc(sc.text || t('(нет текста)'))}</div>
      </div>
    `;
    card.onclick = () => {
      selectScene(i);
      inspectorCard.scrollIntoView({behavior: 'smooth', block: 'nearest'});
    };
    grid.appendChild(card);
  });

  if (!scenes.length) {
    grid.innerHTML = '<div class="muted" style="padding:16px">' + t('Раскадровка пока не сформирована (прогон ещё выполняется).') + '</div>';
  }

  // Upload a custom frame for the selected scene (replaces the asset + re-renders)
  inspectorCard.querySelector('#ins-upload').onclick = () => inspectorCard.querySelector('#ins-file').click();
  inspectorCard.querySelector('#ins-file').onchange = async (e) => {
    const f = e.target.files[0];
    e.target.value = '';
    const sc = scenes[S.selectedScene];
    if (!f || !sc) return;
    const status = inspectorCard.querySelector('#ins-status');
    status.textContent = t('Загружаю кадр…'); status.style.color = 'var(--accent-dim)';
    const b64 = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(f); });
    const up = await api('/api/upload_asset', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name: f.name, b64})});
    if (!up.ok) { status.textContent = t('Ошибка: ') + (up.error || t('загрузка не удалась')); status.style.color = '#f87171'; return; }
    status.textContent = t('Ставлю твой кадр и пересобираю видео…');
    const res = await api(`/api/run/${runId}/modify_scene`, {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({scene_index: S.selectedScene, aspect: 'asset', new_value: up.path})});
    if (res.ok) {
      status.textContent = ' ' + t('Кадр заменён, видео пересобрано!'); status.style.color = '#34d399';
      const fname = up.path.split(/[\\/]/).pop();
      inspectorCard.querySelector('#ins-img').src = '/files/runs/_uploads/' + encodeURIComponent(fname) + '?t=' + Date.now();
      const v = document.getElementById('studio-video');
      if (v && res.video_url) v.src = res.video_url;
    } else {
      status.textContent = t('Ошибка: ') + (res.error || t('не удалось')); status.style.color = '#f87171';
    }
  };

  // AI Prompt Refiner button handler
  inspectorCard.querySelector('#ins-ai-enhance').onclick = async () => {
    const btn = inspectorCard.querySelector('#ins-ai-enhance');
    const sc = scenes[S.selectedScene];
    if (!sc) return;
    const userPrompt = inspectorCard.querySelector('#ins-prompt').value.trim();
    btn.disabled = true;
    btn.textContent = t('ИИ дорабатывает…');
    const res = await api('/api/storyboard/enhance_prompt', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        prompt: userPrompt,
        scene_text: sc.text,
        visual_preset: 'dark_history_cinematic'
      })
    });
    btn.disabled = false;
    btn.textContent = ' ' + t('Доработать промпт с ИИ');
    if (res.ok && res.enhanced_prompt) {
      inspectorCard.querySelector('#ins-prompt').value = res.enhanced_prompt;
      if (res.suggested_effect) inspectorCard.querySelector('#ins-effect').value = res.suggested_effect;
      const rat = inspectorCard.querySelector('#ins-rationale');
      rat.style.display = 'block';
      rat.textContent = ' ' + t('Рекомендация режиссёра: ') + (res.rationale || t('Оптимизировано под аутентичную 35мм плёнку.'));
    }
  };

  // Selective re-render scene button handler
  inspectorCard.querySelector('#ins-apply-btn').onclick = async () => {
    const btn = inspectorCard.querySelector('#ins-apply-btn');
    const st = inspectorCard.querySelector('#ins-status');
    const sc = scenes[S.selectedScene];
    if (!sc) return;
    btn.disabled = true;
    st.textContent = t('Рендерю кадр и пересобираю видео…');
    st.style.color = 'var(--accent-dim)';

    const effectVal = inspectorCard.querySelector('#ins-effect').value;
    const chips = [...inspectorCard.querySelectorAll('#ins-chips .fx-chip.on')].map(c => c.dataset.fx);
    const fxCombo = [effectVal, ...chips].filter(Boolean).join('+');
    const promptVal = inspectorCard.querySelector('#ins-prompt').value;

    // эффект пересобирается всегда (быстро, без генерации картинки);
    // картинка генерируется только если промпт реально изменён
    let res = await api(`/api/run/${runId}/modify_scene`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        scene_index: S.selectedScene,
        aspect: 'effect',
        new_value: fxCombo
      })
    });
    if (res.ok && promptVal && promptVal !== (sc._origPrompt || '')) {
      st.textContent = t('Генерирую новый кадр…');
      res = await api(`/api/run/${runId}/modify_scene`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          scene_index: S.selectedScene,
          aspect: 'image',
          new_value: promptVal
        })
      });
    }
    sc._origFx = fxCombo;
    sc._origPrompt = promptVal;

    btn.disabled = false;
    if (res.ok) {
      st.textContent = ' ' + t('Кадр и видео успешно пересобраны!');
      st.style.color = '#34d399';
      const v = document.getElementById('studio-video');
      if (v && res.video_url) { v.src = res.video_url; v.play(); }
    } else {
      st.textContent = t('Ошибка: ') + (res.error || t('не удалось'));
      st.style.color = '#f87171';
    }
  };

  m.appendChild(inspectorCard);
  m.appendChild(sbCard);

  main.appendChild(m);
  if (scenes.length) selectScene(0);
  pollProgress();
}

// Timecodes Modal / Copy
async function copyTimecodes(runId) {
  const data = await api(`/api/run/${runId}/timecodes`);
  const text = data.text || '';
  if (navigator.clipboard && text) {
    await navigator.clipboard.writeText(text);
    alert(t('Таймкоды для YouTube скопированы в буфер обмена!') + '\n\n' + text);
  } else {
    alert(t('Таймкоды выпуска') + ' ' + runId + ':\n\n' + (text || t('Таймкоды ещё не сгенерированы.')));
  }
}

// Export Folder Modal
async function exportFolderModal(runId) {
  const target = prompt(t('Укажи путь к папке для сохранения всех файлов выпуска') + ' ' + runId + ':', `runs/${runId}/exported`);
  if (!target) return;
  const res = await api(`/api/run/${runId}/export`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({target_folder: target})
  });
  if (res.ok) {
    alert(' ' + t('Успешно экспортировано в') + ' ' + res.folder + ':\n\n' + (res.exported_files || []).join('\n'));
  } else {
    alert(t('Ошибка экспорта: ') + (res.error || t('не удалось экспортировать')));
  }
}

           ${t('План без рендера')}
