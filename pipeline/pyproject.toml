[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline"
version = "0.1.0"
description = "AI video production pipeline: script -> audio -> visual -> assembly -> metadata -> publish"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "typer>=0.12,<1",
    "httpx>=0.27,<0.30",
    "PyYAML>=6.0,<7",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "yt-dlp>=2025.1,<2027",
    "transformers==4.55.2",  # pin: coqui-tts needs isin_mps_friendly; newer drops it
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
secrets = ["keyring>=25,<26"]
whisper = ["faster-whisper>=1.0,<2"]

[project.scripts]
pipeline = "core.cli:app"

[tool.setuptools.packages.find]
include = ["core*", "modules*", "ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
